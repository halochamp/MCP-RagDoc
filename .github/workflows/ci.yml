name: CI
on:
  push:
  pull_request:
jobs:
  test:
    # macos-14 is no longer supported by GitHub-hosted runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: bash scripts/build_vision_ocr.sh
      - run: python -m pytest -q test_suite
